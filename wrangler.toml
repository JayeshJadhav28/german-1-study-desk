name = "nptel"
compatibility_date = "2026-10-24"
workers_dev = true
main = "./src/worker.ts"

[assets]
directory = "./dist-public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/visitor/*"]

[durable_objects]
bindings = [
  { name = "VISITOR_COUNTER", class_name = "VisitorCounter" }
]

[[migrations]]
tag = "v1-visitor-counter"
new_sqlite_classes = ["VisitorCounter"]